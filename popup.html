<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body{width:260px;margin:0;padding:14px;background:#16161a;color:#c9c9c9;
       font:13px/1.6 -apple-system,"PingFang SC",sans-serif}
  h1{font-size:14px;color:#fff;font-weight:500;margin:0 0 2px;display:flex;align-items:center;gap:6px}
  .sub{color:#6e6e78;font-size:11px;margin:0 0 12px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;
       background:#1e1e23;border-radius:8px;margin-bottom:8px}
  .row.off{opacity:.55}
  .switch{position:relative;width:36px;height:20px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#3a3a42;border-radius:20px;cursor:pointer;
          transition:background .15s}
  .slider::before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;
          background:#c9c9c9;border-radius:50%;transition:transform .15s}
  .switch input:checked + .slider{background:#2f6feb}
  .switch input:checked + .slider::before{transform:translateX(16px);background:#fff}
  #siteName{color:#5f9fdc;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tip{color:#6e6e78;font-size:11px;margin:10px 2px 0}
</style>
</head>
<body>
  <h1>🌙 Lurk Mode</h1>
  <p class="sub">潜水模式 · v0.2.3</p>

  <div class="row" id="globalRow">
    <span>全局开关</span>
    <label class="switch"><input type="checkbox" id="global"><span class="slider"></span></label>
  </div>

  <div class="row" id="siteRow">
    <span>本站（<span id="siteName">…</span>）</span>
    <label class="switch"><input type="checkbox" id="site"><span class="slider"></span></label>
  </div>

  <p class="tip">开关双向即时生效，无需刷新页面。本站开关：关 = 加入不打扰名单。</p>

  <script src="popup.js"></script>
</body>
</html>
